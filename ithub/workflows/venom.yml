
name: VENOM IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project parts
        shell: bash
        run: |
          set -euo pipefail

          for part in \
            VENOM_FULL_PART1.zip \
            VENOM_FULL_PART2.zip
          do
            test -s "$part" || {
              echo "::error::Missing $part"
              exit 1
            }

            unzip -tq "$part"
            unzip -oq "$part" -d "$GITHUB_WORKSPACE"
          done

          PROJECT="$GITHUB_WORKSPACE/VENOM_PROJECT_COMPLETE"

          test -f "$PROJECT/ThreeOneOSFive.xcodeproj/project.pbxproj"
          test -f "$PROJECT/ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/VENOM.xcscheme"

      - name: Validate app assets
        shell: bash
        run: |
          set -euo pipefail

          APP="VENOM_PROJECT_COMPLETE/ThreeOneOSFive"

          plutil -lint "$APP/Info.plist"

          for sound in \
            venom_click.wav \
            venom_on.wav \
            venom_off.wav
          do
            test -s "$APP/Audio/$sound" || {
              echo "::error::Missing audio: $sound"
              exit 1
            }
          done

          test -s "$APP/Assets.xcassets/VenomArtwork.imageset/venom.jpg"
          test -s "$APP/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

          echo "Source assets validated."

      - name: Show Xcode information
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          xcodebuild -list \
            -project VENOM_PROJECT_COMPLETE/ThreeOneOSFive.xcodeproj

      - name: Build iOS application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild build \
            -project VENOM_PROJECT_COMPLETE/ThreeOneOSFive.xcodeproj \
            -scheme VENOM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify application bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP=$(find "$APP_DIR" \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)

          test -n "$APP" || {
            echo "::error::Built app not found"
            exit 1
          }

          test -s "$APP/Info.plist"
          test -s "$APP/Assets.car"

          for resource in \
            venom_click.wav \
            venom_on.wav \
            venom_off.wav
          do
            if ! find "$APP" -type f -name "$resource" \
              -print -quit | grep -q .; then
              echo "::error::Missing bundled resource: $resource"
              exit 1
            fi
          done

          echo "Application bundle verified."

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP=$(find "$PRODUCTS" \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print -quit)

          mkdir -p "$RUNNER_TEMP/ipa/Payload"

          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"

          zip -qry "$RUNNER_TEMP/VENOM.ipa" Payload

          unzip -tq "$RUNNER_TEMP/VENOM.ipa"
          test -s "$RUNNER_TEMP/VENOM.ipa"

          du -h "$RUNNER_TEMP/VENOM.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VENOM-IPA
          path: ${{ runner.temp }}/VENOM.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VENOM-BUILD-LOG
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
